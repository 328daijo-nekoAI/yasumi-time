<style>
:root{--p:#4f7cff;--pd:#3a63d8;--bg:#f2f6fd;--card:#fff;--tx:#22304a;--mut:#6b7a96;--line:#e3e9f4;--soft:#eaf0ff;--o:#ff8a3d;--ok:#2fb36b;--bad:#e5484d;--g:#d5dcec;--ova:#2f4fb8;--ovb:#4f7cff;--ovc:#76b6ff}

html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI","Noto Sans JP",sans-serif;-webkit-text-size-adjust:100%}

header{display:flex;align-items:center;gap:8px;padding:12px 16px;max-width:760px;margin:0 auto}

main{max-width:760px;margin:0 auto;padding:0 16px 48px}

.grow{flex:1;min-width:0}

.btn:disabled{background:var(--g);color:#98a3bb;cursor:not-allowed}
.btn.big{width:100%;padding:16px;font-size:18px;border-radius:18px}
.btn.warn{background:var(--o)}.btn.ok{background:var(--ok)}.btn.bad{background:var(--bad)}
.btn.ghost{background:var(--soft);color:var(--pd)}
.btn.ghost:disabled{background:var(--soft);color:var(--mut);opacity:.6}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
.btn.link{background:none;color:var(--mut);font-weight:600;padding:6px 8px}
input,select,textarea{font:inherit;font-size:15px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--card);color:var(--tx);width:100%}
textarea{min-height:110px;font-family:ui-monospace,Menlo,monospace;font-size:12px}
label{display:block;font-size:13px;font-weight:700;margin:12px 0 6px}
.chk{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;margin:14px 0 0}
.chk input{width:auto}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chip{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--soft);color:var(--pd)}
.chip.owner{background:#fff1d6;color:#a0620a}.chip.parent{background:#e3f6ec;color:#1c7a49}
.chip.pending{background:#fff1d6;color:#a0620a}.chip.approved{background:#e3f6ec;color:#1c7a49}.chip.rejected{background:#fde8e8;color:#b32a2e}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:0 0 14px;padding-bottom:2px}
.tabs button{appearance:none;border:0;background:var(--soft);color:var(--pd);font:inherit;font-weight:700;font-size:14px;padding:9px 14px;border-radius:99px;white-space:nowrap;cursor:pointer}
.tabs button.on{background:var(--p);color:#fff}
.badge{background:var(--bad);color:#fff;border-radius:99px;font-size:11px;padding:1px 7px;margin-left:5px}
.hero{text-align:center;padding:26px 8px 10px}
.hero h1{margin:0 0 6px;font-size:28px}
.modes{display:grid;gap:12px}
.mode{display:flex;gap:14px;align-items:center;text-align:left;width:100%;border:0;background:var(--card);border-radius:20px;padding:20px;box-shadow:0 2px 10px rgba(40,60,110,.07);cursor:pointer;font:inherit;color:inherit}
.mode .ic{font-size:34px}.mode b{font-size:17px;display:block}.mode span{font-size:13px;color:var(--mut)}
.pts{font-size:34px;font-weight:800;color:#e0a100}
.ringwrap{position:relative;width:240px;height:240px;margin:6px auto 14px}
.ringwrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.ringwrap .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 30px}
.ringwrap .t{font-size:46px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:1px}
.ringwrap .l{font-size:13px;color:var(--mut);font-weight:700}

.tchips{display:flex;gap:8px;flex-wrap:wrap}

.rv{text-align:right;color:var(--mut);font-variant-numeric:tabular-nums}
#banner{position:fixed;top:0;left:0;right:0;z-index:50;background:var(--o);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:none;align-items:center;gap:12px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
#banner.on{display:flex}
#banner .tx{flex:1;font-weight:700;font-size:14px;line-height:1.4}
#banner button{background:#fff;color:#c4560c;border:0;border-radius:12px;font-weight:800;padding:10px 14px;font-size:14px;cursor:pointer;font-family:inherit}
#ov{position:fixed;inset:0;z-index:100;display:none;flex-direction:column;align-items:center;text-align:center;padding:30px 20px;color:#fff;background:linear-gradient(160deg,var(--ova),var(--ovb) 60%,var(--ovc));overflow-y:auto}
#ov.on{display:flex}#ov.forced{background:linear-gradient(160deg,#c4560c,#ff8a3d 60%,#ffb36b)}

#ov.lock.black{background:#000;color:#aab3c8}#ov.lock.black .big{color:#e3e8f5}#ov.lock.black h1{color:#fff}
#ov .lkic{font-size:56px;margin-bottom:6px}

#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#22304a;color:#fff;padding:11px 18px;border-radius:99px;font-size:14px;z-index:200;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90vw;text-align:center}

.modal{position:fixed;inset:0;background:rgba(20,30,50,.5);z-index:150;display:flex;align-items:center;justify-content:center;padding:20px}
.modal .box{background:var(--card);border-radius:20px;padding:20px;width:100%;max-width:340px;color:var(--tx)}
.modal h3{margin:0 0 6px;font-size:17px}
.err{color:var(--bad);font-size:13px;margin-top:8px;white-space:pre-wrap}
details{margin-top:10px}summary{cursor:pointer;color:var(--mut);font-size:13px;font-weight:700}
code{background:var(--soft);padding:1px 6px;border-radius:6px;font-size:12px}
</style>
</head>

async function hashWith(salt,pin){
  try{ if(crypto?.subtle){
    const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveBits']);
    const b=await crypto.subtle.deriveBits({name:'PBKDF2',salt:new TextEncoder().encode(salt),iterations:150000,hash:'SHA-256'},k,256);
    return 'p'+[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
  } }catch{}
  let h=5381; for(const c of salt+'|'+pin) h=((h<<5)+h+c.charCodeAt(0))|0; return 'f'+h;
}

/* ---------------- Firebase adapter ---------------- */
async function makeFirebase(cfg){
  const B='https://www.gstatic.com/firebasejs/10.14.1/';
  const [A,Au,F] = await Promise.all([import(B+'firebase-app.js'), import(B+'firebase-auth.js'), import(B+'firebase-firestore.js')]);
  const app=A.initializeApp(cfg), auth=Au.getAuth(app), db=F.getFirestore(app);
  const fd=(fid,...p)=>F.doc(db,'families',fid,...p);
  const col=(fid,n)=>F.collection(db,'families',fid,n);
  return {
    kind:'firebase',
    onAuth(cb){ Au.onAuthStateChanged(auth,u=>cb(u?{uid:u.uid,name:u.displayName||u.email||'ユーザー',photo:u.photoURL||'',email:u.email||''}:null)); },
    async signInWithToken(t){ await Au.signInWithCredential(auth, Au.GoogleAuthProvider.credential(t.id||null, t.at||null)); },
    async getMaster(){ const s=await F.getDoc(F.doc(db,'config','master')); return s.exists()?(s.data().hash||null):null; },
    async setMaster(hash){ await F.setDoc(F.doc(db,'config','master'),{hash:hash||null,at:Date.now()}); },
    async signIn(){
      const p=new Au.GoogleAuthProvider(); p.setCustomParameters({prompt:'select_account'});
      try{ await Au.signInWithPopup(auth,p); }
      catch(e){
        if(['auth/popup-blocked','auth/operation-not-supported-in-this-environment'].includes(e.code)) await Au.signInWithRedirect(auth,p);
        else if(!['auth/popup-closed-by-user','auth/cancelled-popup-request'].includes(e.code)) throw e;
      }
    },
    signOut(){ return Au.signOut(auth); },
    async getMyFid(uid){ const s=await F.getDoc(F.doc(db,'users',uid)); return s.exists()?s.data().fid:null; },
    async createFamily(u,name){
      let code; for(let i=0;i<6;i++){ code=genCode(); if(!(await F.getDoc(fd(code))).exists()) break; }
      await F.setDoc(fd(code),{name,code,ownerUid:u.uid,settings:DEFAULTS,missions:DEFAULT_MISSIONS,createdAt:Date.now()});
      await F.setDoc(fd(code,'members',u.uid),{name:u.name,photo:u.photo,role:'owner',points:0,total:0,joinedAt:Date.now()});
      await F.setDoc(F.doc(db,'users',u.uid),{fid:code});
      for(const r of SEED) await F.addDoc(col(code,'rewards'),r);
      return code;
    },
    async joinFamily(u,code){
      code=code.trim().toUpperCase();
      if(!(await F.getDoc(fd(code))).exists()) throw new Error('そのコードの家族が見つかりません');
      if(!(await F.getDoc(fd(code,'members',u.uid))).exists())
        await F.setDoc(fd(code,'members',u.uid),{name:u.name,photo:u.photo,role:'child',points:0,total:0,joinedAt:Date.now()});
      await F.setDoc(F.doc(db,'users',u.uid),{fid:code});
      return code;
    },
    async leave(uid){ await F.deleteDoc(F.doc(db,'users',uid)); },
    watch(fid,cb){
      const D={ready:false,family:null,members:{},rewards:[],requests:[],log:[],pinHash:null};
      const got={f:false,m:false,p:false};
      const push=()=>{ D.ready=got.f&&got.m&&got.p; cb(D); };
      const err=e=>{ console.error(e); toast('読み込みエラー: '+(e.code||e.message)); };
      const u=[
        F.onSnapshot(fd(fid),s=>{got.f=true;D.family=s.exists()?s.data():null;push();},err),
        F.onSnapshot(col(fid,'members'),s=>{got.m=true;D.members={};s.forEach(d=>D.members[d.id]=d.data());push();},err),
        F.onSnapshot(col(fid,'rewards'),s=>{D.rewards=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.cost-b.cost);push();},err),
        F.onSnapshot(F.query(col(fid,'requests'),F.orderBy('at','desc'),F.limit(100)),s=>{D.requests=s.docs.map(d=>({id:d.id,...d.data()}));push();},err),
        F.onSnapshot(F.query(col(fid,'log'),F.orderBy('at','desc'),F.limit(600)),s=>{D.log=s.docs.map(d=>({id:d.id,...d.data()}));push();},err),
        F.onSnapshot(fd(fid,'private','pin'),s=>{got.p=true;D.pinHash=s.exists()?s.data().hash:null;push();},()=>{got.p=true;push();})
      ];
      return ()=>u.forEach(x=>x());
    },
    saveSettings:(fid,s)=>F.updateDoc(fd(fid),{settings:s}),
    saveMissions:(fid,m)=>F.updateDoc(fd(fid),{missions:m}),
    renameFamily:(fid,name)=>F.updateDoc(fd(fid),{name}),
    setMember:(fid,uid,p)=>F.updateDoc(fd(fid,'members',uid),p),
    removeMember:(fid,uid)=>F.deleteDoc(fd(fid,'members',uid)),
    addPoints:(fid,uid,n)=>F.updateDoc(fd(fid,'members',uid),{points:F.increment(n)}),
    bump:(fid,uid,inc,set)=>{ const u={...(set||{})}; for(const k in inc) u[k]=F.increment(inc[k]); return F.updateDoc(fd(fid,'members',uid),u); },
    addReward:(fid,r)=>F.addDoc(col(fid,'rewards'),r),
    delReward:(fid,id)=>F.deleteDoc(fd(fid,'rewards',id)),
    addRequest:(fid,r)=>F.addDoc(col(fid,'requests'),r),
    setRequest:(fid,id,p)=>F.updateDoc(fd(fid,'requests',id),p),
    addLog:(fid,e)=>F.addDoc(col(fid,'log'),e),
    setPin:(fid,hash)=>F.setDoc(fd(fid,'private','pin'),{hash:hash||null})
  };
}

function makeLocal(){

  S = S || {family:null,members:{},rewards:[],requests:[],log:[],pinHash:null,seq:1};
  const cbs=new Set();
  const view=()=>({ready:true,...JSON.parse(JSON.stringify(S))});
  const save=()=>{ localStorage.setItem(KEY,JSON.stringify(S)); cbs.forEach(f=>f(view())); };
  const id=()=>'l'+(S.seq++);
  const U={uid:'demo',name:'おためしユーザー',photo:''};
  return {
    kind:'local',
    onAuth(cb){ setTimeout(()=>cb(U),0); },
    async signIn(){}, async signOut(){ localStorage.removeItem('yt_demo'); },
    async signInWithToken(){}, async getMaster(){ return S.masterHash||null; }, async setMaster(h){ S.masterHash=h||null; save(); },
    async getMyFid(){ return S.family?S.family.code:null; },
    async createFamily(u,name){
      S.family={name,code:'DEMO01',ownerUid:u.uid,settings:{...DEFAULTS},missions:JSON.parse(JSON.stringify(DEFAULT_MISSIONS))};
      S.members[u.uid]={name:u.name,photo:'',role:'owner',points:0,total:0,joinedAt:Date.now()};
      S.rewards=SEED.map(r=>({id:id(),...r})); save(); return 'DEMO01';
    },
    async joinFamily(){ throw new Error('お試しモードでは「家族に参加」は使えません'); },
    async leave(){ },
    watch(fid,cb){ cbs.add(cb); cb(view()); return ()=>cbs.delete(cb); },
    async saveSettings(f,s){ S.family.settings=s; save(); },
    async saveMissions(f,m){ S.family.missions=m; save(); },
    async renameFamily(f,n){ S.family.name=n; save(); },
    async setMember(f,u,p){ Object.assign(S.members[u],p); save(); },
    async removeMember(f,u){ delete S.members[u]; save(); },
    async addPoints(f,u,n){ S.members[u].points=(S.members[u].points||0)+n; save(); },
    async bump(f,u,inc,set){ const m=S.members[u]; for(const k in inc) m[k]=(m[k]||0)+inc[k]; Object.assign(m,set||{}); save(); },
    async addReward(f,r){ S.rewards.push({id:id(),...r}); S.rewards.sort((a,b)=>a.cost-b.cost); save(); },
    async delReward(f,i){ S.rewards=S.rewards.filter(r=>r.id!==i); save(); },
    async addRequest(f,r){ S.requests.unshift({id:id(),...r}); save(); },
    async setRequest(f,i,p){ Object.assign(S.requests.find(r=>r.id===i),p); save(); },
    async addLog(f,e){ S.log.unshift({id:id(),...e}); S.log=S.log.slice(0,600); save(); },
    async setPin(f,h){ S.pinHash=h||null; save(); },
    reset(){ localStorage.removeItem(KEY); }
  };
}

/* ---------------- usage limits ---------------- */
function inQuiet(on,a,b){
  if(!on) return false; const d=new Date(), now=d.getHours()*60+d.getMinutes();
  const p=x=>{ const [h,m]=String(x||'0:0').split(':'); return (+h||0)*60+(+m||0); };
  const s=p(a), e=p(b); if(s===e) return false;
  return s<e ? (now>=s&&now<e) : (now>=s||now<e);
}
function runningMs(){
  if(T.phase==='working'||T.phase==='due') return Date.now()-T.workStart;
  if(T.phase==='forced') return Math.max(0,T.dueAt+T.snap.graceMin*60000-T.workStart);
  return 0;
}
function usedMs(){ const m=me(); const base=(m?.usageDay===dayStr()?(m.usageMs||0):0); return base+runningMs(); }
function limitState(){
  const s=settings();
  if(inQuiet(s.quietOn,s.quietStart,s.quietEnd)) return {blocked:true,msg:`いまは使えない時間です（${s.quietStart}〜${s.quietEnd}）`};
  const lim=Number(s.dailyLimitMin)||0;
  if(lim>0 && usedMs()>=lim*60000) return {blocked:true,msg:`今日の使用時間（${lim}分）をつかいきりました。また明日！`};
  return {blocked:false};
}

function streakUpdate(m){

async function commitAward(ents,inc,set){

/* ---------------- Timer logic ---------------- */
const tkey = () => 'yt_timer_'+App.user.uid;
function loadT(){ try{T=JSON.parse(localStorage.getItem(tkey()));}catch{T=null;} if(!T||!T.phase) T={phase:'idle'}; NB.busy(T.phase!=='idle'); }
function saveT(){ localStorage.setItem(tkey(),JSON.stringify(T)); NB.busy(T.phase!=='idle'); pushSession(); }
function untilOf(){
  const s=T.snap||settings();

  if(T.phase==='due') return T.dueAt+s.graceMin*60000;

  return 0;
}
function pushSession(){
  if(!App.adapter||!App.fid||!me()) return;

}
function startSession(){

  T={phase:'working',workStart:Date.now(),snap:{...settings()}};

}
function endSession(){ closeSegment(); T={phase:'idle'}; saveT(); render(true); }
function takeBreak(){
  const kind=T.phase==='due'?'ok':'forced';
  const used=Math.round(runningMs());           // 先に使った時間を確定（記録の書きこみで画面が途中の状態にならないように）
  const now=Date.now();

  Q=null; tipShown=-1; closeSegment(used); saveT(); render(true);
}
async function finishBreak(){
  const kind=T.breakKind, pts=Number(T.snap?.points)||0, A=App.adapter, fid=App.fid, uid=App.user.uid, m=me(), name=m?.name||'';
  const parts=[]; let total=0;
  if(kind==='ok'){
    const ents=[{type:'break_ok',pts,text:''}], inc={breaksOk:1}, set={}; total=pts; parts.push(`休憩 +${pts}pt`);
    const su=streakUpdate(m);
    if(su.changed){ set.streak=su.streak; set.streakDay=su.streakDay; set.bestStreak=Math.max(m.bestStreak||0,su.streak);
      if(su.bonus>0){ ents.push({type:'streak',pts:su.bonus,text:su.streak+'日れんぞく'}); total+=su.bonus; parts.push(`🔥${su.streak}日れんぞく +${su.bonus}pt`); } }
    const ms=missionsToAward({breaks:1});
    ms.forEach(x=>{ ents.push({type:'mission',pts:x.bonus,text:missionLabel(x),mid:x.id}); total+=x.bonus; parts.push(`🎯${missionLabel(x)} +${x.bonus}pt`); });
    if(ms.length) inc.missionsDone=ms.length;
    inc.points=total; inc.total=total;
    T={phase:'idle',last:{kind:'ok',pts:total,parts}};
    saveT(); notify(`休憩おわり！ +${total}pt`); beep(); render(true);
    await guard(()=>commitAward(ents,inc,set));
  } else {
    T={phase:'idle',last:{kind:'forced',pts:0,parts}};
    saveT(); notify('休憩おわり（ポイントなし）'); beep(); render(true);

  }
}
/* 休憩・ロック中の解除：保護者の合言葉、または作者のマスターパスワード */
async function requireOverride(){
  if(!D()?.pinHash && !App.masterHash){ toast('ここからは解除できません。時間がたつまで待ってね'); return false; }
  if(App.pinUntil>Date.now()) return true;
  if(App.lockUntil>Date.now()){ toast('まちがいが続いたので、'+Math.ceil((App.lockUntil-Date.now())/1000)+'秒まってね'); return false; }
  const v=await ask({title:'解除の合言葉',text:'保護者の合言葉、または作者のマスターパスワードを入れてください',type:'password'});
  if(v==null||v==='') return false;
  const okG = !!D()?.pinHash && (await hashPin(v))===D().pinHash;
  const okM = !okG && !!App.masterHash && (await hashMaster(v))===App.masterHash;
  if(okG||okM){ App.fails=0; return true; }
  App.fails=(App.fails||0)+1;
  if(App.fails>=5){ App.lockUntil=Date.now()+60000; App.fails=0; toast('5回まちがえました。1分まってね'); } else toast('合言葉がちがいます');
  return false;
}
/* 解除したあと、残りの休憩を何分にするか決める。0分なら「もう休憩が終わりです」 */
async function overrideBreak(){
  if(T.phase!=='break') return;
  if(!(await requireOverride())) return;
  const raw=await ask({title:'休憩をどうしますか？',text:'残りの休憩を何分にするか入れてください。0分にすると「もう休憩が終わりです」になり、すぐ使えます。（ポイントは入りません）',type:'number',value:'0',inputmode:'decimal',okText:'反映'});
  if(raw==null) return;
  let n=parseFloat(raw); if(!isFinite(n)||n<0) n=0;
  const uid=App.user.uid, name=me()?.name||'';
  if(n<=0){ T={phase:'idle',last:{kind:'shortened'}}; saveT(); render(true); }
  else { T={...T,breakKind:'forced',breakEnd:Date.now()+n*60000}; saveT(); ovSig=''; render(true); toast('残り '+n+' 分にしました'); }
  guard(()=>App.adapter.addLog(App.fid,{uid,name,type:'break_shortened',pts:0,text:n+'分',at:Date.now()}));
}
function forceStop(msg){
  closeSegment(); T={phase:'idle',last:{kind:'limit',msg}}; saveT(); notify(msg); beep(); render(true);
}
function tick(){
  if(!App.data?.ready||!App.user||!me()) return;
  const now=Date.now(); const s=T.snap; let changed=false;
  if((T.phase==='working'||T.phase==='due') && limitState().blocked){ forceStop(limitState().msg); return; }
  if(T.phase==='working' && now>=T.workStart+s.workMin*60000){ T.phase='due'; T.dueAt=T.workStart+s.workMin*60000; changed=true; notify('休憩の時間です！休憩するとポイントがもらえます'); beep(); }
  if(T.phase==='due' && now>=T.dueAt+s.graceMin*60000){
    T.phase='forced'; changed=true;
    if(sv('autoLock')!==false){ notify('設定した時間に終了しました'); beep(); takeBreak(); return; }
    notify('休憩してください'); beep();
  }
  if(T.phase==='break' && now>=T.breakEnd){ finishBreak(); return; }
  if(changed){ saveT(); render(true); }
  updateLive();
}
function askNotify(){ try{ if('Notification' in window && Notification.permission==='default') Notification.requestPermission(); }catch{} }
function notify(msg){
  try{ if('Notification' in window && Notification.permission==='granted' && document.hidden){
    if(navigator.serviceWorker) navigator.serviceWorker.getRegistration().then(r=>{ if(r) r.showNotification('やすみタイム',{body:msg,icon:'icon-192.png',vibrate:[200,100,200]}); else new Notification('やすみタイム',{body:msg}); });
    else new Notification('やすみタイム',{body:msg});
  } }catch{}
}
function beep(){
  const st=settings();
  try{ if(st.vibrate!==false && navigator.vibrate) navigator.vibrate([250,120,250]); }catch{}
  if(st.sound===false) return;
  try{ const c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain(); o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.value=.15;o.start();o.stop(c.currentTime+.35);}catch{}
}
function syncWake(){

function todayStats(){
  const t0=today0(), uid=App.user.uid; const L=D().log.filter(l=>l.uid===uid&&l.at>=t0);
  return {ok:L.filter(l=>l.type==='break_ok').length, pts:L.filter(l=>['break_ok','streak','mission','quiz_ok'].includes(l.type)).reduce((a,l)=>a+(l.pts||0),0), miss:L.filter(l=>l.type==='break_forced'||l.type==='break_aborted').length};
}
const REQ_LABEL={pending:'承認まち',approved:'承認ずみ',rejected:'見送り'};
function rewardLimitText(r){
  const a=[]; if(r.perDay>0) a.push('1日'+r.perDay+'回まで'); if(r.perWeek>0) a.push('週'+r.perWeek+'回まで'); if(r.expires) a.push(r.expires+'まで');
  return a.join(' ・ ');
}
function rewardStatus(r){
  const uid=App.user.uid, reqs=D().requests.filter(q=>q.uid===uid&&q.rewardId===r.id&&q.status!=='rejected');
  if(r.expires && dayStr()>r.expires) return {ok:false,why:'きげんぎれ'};
  if(r.perDay>0 && reqs.filter(q=>q.at>=today0()).length>=r.perDay) return {ok:false,why:'きょうはおわり'};
  if(r.perWeek>0 && reqs.filter(q=>q.at>=weekStart()).length>=r.perWeek) return {ok:false,why:'こんしゅうはおわり'};
  return {ok:true};
}

function sessionText(m){
  const x=m.session; if(!x) return '記録なし';
  const ago=Date.now()-x.at; if(ago>6*3600000) return '待機中（'+hhmm(x.at)+'更新）';
  if(x.phase==='working') return '使用中（休憩まで'+fmt(x.until-Date.now())+'）';
  if(x.phase==='due') return '休憩の知らせ中';
  if(x.phase==='break') return '休憩中';
  if(x.phase==='forced') return '休憩とばし中';
  return '待機中（'+hhmm(x.at)+'更新）';
}
function weekRows(uid){
  const rows=[];
  for(let i=6;i>=0;i--){
    const d=new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-i); const d0=d.getTime(), d1=d0+864e5;
    const L=D().log.filter(l=>l.uid===uid&&l.at>=d0&&l.at<d1);
    rows.push({d, use:L.filter(l=>l.type==='usage').reduce((a,l)=>a+(l.ms||0),0), ok:L.filter(l=>l.type==='break_ok').length, pts:L.filter(l=>['break_ok','streak','mission','quiz_ok'].includes(l.type)).reduce((a,l)=>a+(l.pts||0),0)});
  }
  return rows;
}

    b=`<div class="card"><h2>デイリーミッション</h2><div class="muted">毎日リセットされます。達成するとボーナスポイントがもらえます。</div>${missions().length?missions().map(x=>`<div class="item"><div class="grow"><b>${esc(missionLabel(x))}</b><div class="muted">達成で +${x.bonus}pt</div></div><button class="btn bad sm" data-act="delMission" data-id="${x.id}">削除</button></div>`).join(''):'<div class="muted" style="margin-top:8px">まだありません</div>'}
      <h3>ミッションを追加</h3>
      <label>種類</label><select id="mKind"><option value="breaks">休憩を◯回できる</option><option value="quiz">クイズに◯問せいかいする</option></select>
      <div class="two"><div><label>回数</label><input id="mTarget" type="number" min="1" value="3" inputmode="numeric"></div><div><label>ボーナス(pt)</label><input id="mBonus" type="number" min="1" value="10" inputmode="numeric"></div></div>
      <button class="btn" style="margin-top:12px" data-act="addMission">追加</button></div>`;
  } else if(App.tab==='requests'){
    const P=D().requests.filter(r=>r.status==='pending'), R=D().requests.filter(r=>r.status!=='pending').slice(0,10);
    b=`<div class="card"><h2>交換のリクエスト</h2>${P.length?P.map(r=>`<div class="item"><div class="grow"><b>${esc(r.name)}</b> → ${esc(r.rewardName)}<div class="muted">⭐ ${r.cost}pt ・ ${hhmm(r.at)}</div></div><button class="btn ok sm" data-act="approve" data-id="${r.id}">承認</button><button class="btn bad sm" data-act="reject" data-id="${r.id}">見送り</button></div>`).join(''):'<div class="muted">承認まちはありません</div>'}
      ${R.length?`<h3>最近のもの</h3>${R.map(r=>`<div class="item"><div class="grow">${esc(r.name)} → ${esc(r.rewardName)}</div><span class="chip ${r.status}">${REQ_LABEL[r.status]||r.status}</span></div>`).join('')}`:''}
      <div class="muted" style="margin-top:10px">交換を申しこんだ時点でポイントは引かれます。見送りにすると返ります。アプリを開いているときは、申しこみがあると通知が出ます。</div></div>`;
  } else {
    const T_={break_ok:'✅ 休憩できた',break_forced:'⚠️ 休憩がおくれた',break_aborted:'⛔ 休憩をやめた',break_shortened:'⏩ 解除して休憩をみじかくした',redeem:'🎁 交換',adjust:'🛠 ポイント調整',approve:'👍 承認',reject:'↩️ 見送り',streak:'🔥 れんぞくボーナス',mission:'🎯 ミッション達成',quiz_ok:'🧠 クイズせいかい',quiz_ng:'🧠 クイズ(ざんねん)'};
    b=`<div class="card"><h2>履歴（新しい順）</h2>${D().log.filter(l=>l.type!=='usage').slice(0,60).map(l=>`<div class="item"><div class="grow"><b>${esc(l.name||'')}</b> ${T_[l.type]||l.type}${l.text?` <span class="muted">${esc(l.text)}</span>`:''}</div><span class="muted">${new Date(l.at).getMonth()+1}/${new Date(l.at).getDate()} ${hhmm(l.at)}${l.pts?` ・ ${l.pts>0?'+':''}${l.pts}pt`:''}</span></div>`).join('')||'<div class="muted">まだありません</div>'}</div>`;
  }
  return `<div class="hero" style="padding-top:6px"><h1 style="font-size:22px">👪 保護者パネル</h1></div>${tabs}${b}`;
}
function vOwner(){
  const f=D().family;
  return `<div class="hero" style="padding-top:6px"><h1 style="font-size:22px">👑 所有者パネル</h1></div>
  ${pinCard()}
  <div class="card"><h2>家族コード</h2><div class="muted">家族がログインして「家族に参加する」でこのコードを入れると参加できます。</div>
    <div class="row" style="margin-top:10px"><div class="pts" style="letter-spacing:4px;font-size:30px">${esc(f.code)}</div><button class="btn ghost sm" data-act="copyCode">コピー</button></div>
    <label>家族の名前</label><div class="row"><div class="grow"><input id="oName" value="${esc(f.name)}" maxlength="20"></div><button class="btn sm" data-act="renameFam">変更</button></div></div>
  <div class="card"><h2>メンバーと役割</h2><div class="muted">参加した人は最初「子ども」です。保護者にする人は役割を変えてください。</div>
    ${Object.entries(D().members).map(([uid,m])=>`<div class="item"><div class="av">${esc((m.name||'?')[0])}</div><div class="grow"><b>${esc(m.name)}</b><div class="muted">⭐ ${m.points||0}pt</div></div>${m.role==='owner'?`<span class="chip owner">所有者</span>`:`<select style="width:110px" data-chg="role" data-uid="${uid}"><option value="child" ${m.role==='child'?'selected':''}>子ども</option><option value="parent" ${m.role==='parent'?'selected':''}>保護者</option></select><button class="btn bad sm" data-act="removeMember" data-uid="${uid}">外す</button>`}</div>`).join('')}</div>
  ${isCreator()?`<div class="card"><h2>🗝️ 作者マスターパスワード</h2><div class="muted">どの家族でも、休憩中のロックを一時的に解除できるパスワードです。作者（このアプリを作った人）のGoogleアカウントだけが設定できます。${App.masterHash?'いまは<b>設定ずみ</b>です。':'まだ設定されていません。'}他の人には教えないでください。8文字以上の長めの文章がおすすめです。</div>
    <label>新しいマスターパスワード</label><input id="mp1" type="password" autocomplete="new-password">
    <label>もう一度</label><input id="mp2" type="password" autocomplete="new-password">
    <button class="btn big" style="margin-top:14px" data-act="setMaster">${App.masterHash?'変更する':'設定する'}</button>
    ${App.masterHash?'<button class="btn bad sm" style="margin-top:10px" data-act="clearMaster">マスターを無効にする</button>':''}</div>`:''}
  ${App.adapter.kind==='local'?`<div class="card"><h2>お試しモード</h2><div class="muted">この端末だけに保存されています。</div><button class="btn bad sm" style="margin-top:10px" data-act="resetDemo">データを全部消す</button></div>`:''}`;
}

function render(force){
  const ae=document.activeElement;
  if(!force && ae && /INPUT|SELECT|TEXTAREA/.test(ae.tagName) && $('#app').contains(ae)){ App.dirty=true; return; }
  App.dirty=false;
  let body='';
  try{
    if(App.data?.ready && me()) applyTheme(themeFor(me())); else applyTheme('normal');
    if(App.screen==='boot') body='<div class="hero"><div class="muted">よみこみ中…</div></div>';
    else if(App.screen==='login') body=vLogin();
    else if(App.screen==='setup') body=vSetup();
    else if(!App.data||!App.data.ready||!me()) body='<div class="hero"><div class="muted">よみこみ中…</div></div>';
    else if(App.screen==='setpin') body=role()==='owner'?vSetPin():vModes();
    else if(App.screen==='modes') body=vModes();
    else if(App.screen==='child') body=vChild();
    else if(App.screen==='parent') body=isAdmin()?vParent():vModes();
    else if(App.screen==='owner') body=role()==='owner'?vOwner():vModes();
  }catch(e){ console.error(e); body='<div class="card err">表示でエラーが起きました: '+esc(e.message)+'</div>'; }
  $('#app').innerHTML=header()+`<main>${body}</main>`;
  renderOverlay(); updateLive();
}
document.addEventListener('focusout',()=>setTimeout(()=>{ if(App.dirty) render(); },60));

/* ---------------- Navigation & actions ---------------- */
async function go(to){
  if(to==='parent'||to==='owner'){
    if(!D().pinHash){
      if(role()==='owner'){ App.screen='setpin'; render(true); scrollTo(0,0); return; }
      toast('所有者が合言葉を決めるまで、保護者パネルは使えません'); return;
    }
    if(!(await requirePin())) return;
    askNotify();
  } else { App.pinUntil=0; }
  App.screen=to; if(to==='parent'&&!App.tab) App.tab='members'; render(true); scrollTo(0,0);
}
async function enter(fid){
  App.fid=fid; App.data=null; App.seenReq=null; loadT();
  App.masterHash=null; try{ App.adapter.getMaster().then(h=>{ App.masterHash=h||null; }).catch(()=>{}); }catch{}
  if(App.unsub) App.unsub();
  let first=true;
  App.unsub=App.adapter.watch(fid,async d=>{
    App.data=d;
    if(d.ready){
      if(!d.family || !d.members[App.user.uid]){
        if(App.unsub){App.unsub();App.unsub=null;}
        await App.adapter.leave(App.user.uid).catch(()=>{});
        App.fid=null; App.screen='setup'; App.error='家族から外れたか、家族が見つかりませんでした。'; render(true); return;
      }
      notifyChanges(d);
      if(first){ first=false; App.screen = role()==='child' ? 'child' : (role()==='owner'&&!d.pinHash ? 'setpin' : 'modes'); render(true); return; }
      if(role()==='child' && App.screen!=='child') App.screen='child';
      if(role()==='owner' && !d.pinHash && App.screen!=='setpin') App.screen='setpin';
    }
    render();
  });
}
async function onUser(u){
  App.user=u; App.error='';
  if(!u){ if(App.unsub){App.unsub();App.unsub=null;} App.fid=null;App.data=null; App.screen='login'; render(true); return; }
  App.screen='boot'; render(true);
  try{
    const fid=await App.adapter.getMyFid(u.uid);
    if(fid) await enter(fid); else { App.screen='setup'; render(true); }
  }catch(e){ console.error(e); App.error='読みこみに失敗しました: '+(e.code||e.message)+'\nFirestoreのルールと設定を確認してください。'; App.screen='login'; render(true); }
}

document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-act]'); if(!el) return;
  const act=el.dataset.act, id=el.dataset.id, uid=el.dataset.uid, fid=App.fid, A=App.adapter;
  if(el.disabled) return;
  switch(act){
    case 'login': {
      App.error='';
      if(!A||A.kind!=='firebase'){ App.error='Googleログインには Firebase の設定が必要です。下の「Firebase設定を貼りつける」に貼ってください（手順は README.md）。'; render(true); break; }
      if(NB.on){
        const h=String(window.YASUMI_HOST||'').trim();
        if(!h){ App.error='ログイン用のページのアドレスが設定されていません（native-config.js の YASUMI_HOST）。'; render(true); break; }
        NB.open(h.replace(/\/?$/,'/')+'native-login.html?redirect='+encodeURIComponent(NB.redirect));
        toast('ブラウザが開きます。Googleでログインしたら、このアプリにもどってきます'); break;
      }
      try{ await A.signIn(); }catch(err){
        const m={'auth/unauthorized-domain':'このアドレスがFirebaseの「承認済みドメイン」に入っていません。Authentication → 設定 で追加してください。','auth/operation-not-allowed':'FirebaseでGoogleログインが有効になっていません。Authentication → ログイン方法 で有効にしてください。','auth/network-request-failed':'ネットワークに接続できません。'};
        App.error=m[err.code]||('ログインできませんでした: '+(err.code||err.message)); render(true);
      } break; }
    case 'demo': localStorage.setItem('yt_demo','1'); App.adapter=makeLocal(); App.adapter.onAuth(onUser); break;
    case 'saveCfg': {
      try{ let t=$('#cfg').value.trim(); t=t.replace(/^\s*(const|let|var)\s+\w+\s*=\s*/,'').replace(/;\s*$/,'');
        let cfg; try{ cfg=JSON.parse(t); }catch{ cfg=(new Function('return ('+t+')'))(); }
        if(!cfg.apiKey||!cfg.projectId) throw new Error('apiKey と projectId が見つかりません');
        localStorage.setItem('yt_cfg',JSON.stringify(cfg)); localStorage.removeItem('yt_demo'); location.reload();
      }catch(err){ App.error='設定を読みこめません: '+err.message; render(true); }
      break; }
    case 'clearCfg': localStorage.removeItem('yt_cfg'); location.reload(); break;
    case 'logout': if(T.phase!=='idle' && !(await requirePin())) break; await guard(()=>A.signOut()); if(A.kind==='local') location.reload(); break;
    case 'install': if(deferredInstall){ deferredInstall.prompt(); try{ await deferredInstall.userChoice; }catch{} deferredInstall=null; render(true); } break;
    case 'go': go(el.dataset.to); break;
    case 'tab': App.tab=el.dataset.t; render(true); break;
    case 'createFam': { const n=$('#famName').value.trim(); if(!n) return toast('家族の名前を入れてください');
      await guard(async()=>{ const code=await A.createFamily(App.user,n); App.error=''; await enter(code); }); break; }
    case 'joinFam': { const c=$('#famCode').value.trim(); if(c.length<4) return toast('コードを入れてください');
      try{ const code=await A.joinFamily(App.user,c); App.error=''; await enter(code); }catch(err){ App.error=err.message||'参加できませんでした'; render(true); } break; }
    case 'start': startSession(); break;
    case 'endSess': if(confirm('今日はここでおわりますか？（ポイントはもらえません）')) endSession(); break;
    case 'takeBreak': takeBreak(); break;
    case 'abort': case 'override': overrideBreak(); break;
    case 'setMaster': { if(!isCreator()) return; const a=$('#mp1')?.value??'', b=$('#mp2')?.value??'';
      if(a.length<8) return toast('8文字以上にしてください');
      if(a!==b) return toast('2つが同じではありません');
      await guard(async()=>{ await A.setMaster(await hashMaster(a)); App.masterHash=await A.getMaster(); toast('マスターパスワードを設定しました'); render(true); }); break; }
    case 'clearMaster': if(isCreator()&&confirm('マスターパスワードを無効にしますか？')) await guard(async()=>{ await A.setMaster(null); App.masterHash=null; toast('無効にしました'); render(true); }); break;
    case 'androidAdmin': try{ const r=await NB.admin(); toast(r&&r.active?'すでに許可されています':'表示された画面で「有効にする」を押してください'); }catch{ toast('この端末では使えません'); } break;
    case 'qans': answerQuiz(parseInt(el.dataset.i,10)); break;
    case 'qnext': if(T.phase==='break'&&sv('quizOn')!==false){ Q={bk:T.breakStart,q:pickQuiz(),done:false}; ovSig=''; renderOverlay(); } break;
    case 'theme': await guard(()=>A.setMember(fid,App.user.uid,{theme:id})); break;
    case 'goal': await guard(async()=>{ await A.setMember(fid,App.user.uid,{goalId:id}); toast('もくひょうにしたよ！'); }); break;
    case 'redeem': { const r=D().rewards.find(x=>x.id===id); if(!r) return;
      const rs=rewardStatus(r); if(!rs.ok) return toast('このごほうびは、いまは交換できません（'+rs.why+'）');
      if((me().points||0)<r.cost) return toast('ポイントがたりません');
      if(!confirm(`「${r.name}」と交換しますか？（${r.cost}pt）\n保護者の承認でもらえます。`)) return;
      await guard(async()=>{ const m0=me(), m2={...m0,redeems:(m0.redeems||0)+1}, nb=badgeIds(m2).filter(x=>!badgeIds(m0).includes(x));
        await A.bump(fid,App.user.uid,{points:-r.cost,redeems:1},{});
        await A.addRequest(fid,{uid:App.user.uid,name:me().name,rewardId:r.id,rewardName:r.name,cost:r.cost,status:'pending',at:Date.now()});
        await A.addLog(fid,{uid:App.user.uid,name:me().name,type:'redeem',pts:-r.cost,text:r.name,at:Date.now()});
        toast(nb.length?`申しこみました！ 🏅 バッジ「${BADGES.find(b=>b.id===nb[0]).n}」をゲット！`:'申しこみました！'); }); break; }
    case 'saveSettings': { const s={workMin:num($('#sWork').value,DEFAULTS.workMin),breakMin:num($('#sBreak').value,DEFAULTS.breakMin),graceMin:num($('#sGrace').value,DEFAULTS.graceMin),points:Math.round(num($('#sPts').value,DEFAULTS.points)),
        dailyLimitMin:int0($('#sLimit').value),quietOn:$('#sQuiet').checked,quietStart:$('#sQs').value||'21:00',quietEnd:$('#sQe').value||'07:00',
        streak3:int0($('#sSt3').value,DEFAULTS.streak3),streak7:int0($('#sSt7').value,DEFAULTS.streak7),tipsOn:$('#sTips').checked,quizOn:$('#sQuiz').checked,quizPts:int0($('#sQpt').value,DEFAULTS.quizPts),quizMax:Math.max(1,int0($('#sQmax').value,DEFAULTS.quizMax)),
        sound:$('#sSound').checked,vibrate:$('#sVib').checked,keepAwake:$('#sAwake').checked,
        autoLock:$('#sAuto').checked,blackout:$('#sBlack').checked,lockText:($('#sLockText').value.trim()||DEFAULTS.lockText),displayOff:$('#sDispOff').checked};
      await guard(async()=>{ await A.saveSettings(fid,s); toast('保存しました'); render(true); }); break; }
    case 'saveKid': { const g=(i,zero)=>{ const v=$(i).value.trim(); if(v==='') return undefined; const n=parseFloat(v); return isFinite(n)&&(zero?n>=0:n>0)?n:undefined; };
      const o={workMin:g('#kWork'),breakMin:g('#kBreak'),graceMin:g('#kGrace'),points:g('#kPts'),dailyLimitMin:g('#kLimit',true)}; Object.keys(o).forEach(k=>o[k]===undefined&&delete o[k]);
      await guard(async()=>{ await A.setMember(fid,uid,{settings:o}); toast('保存しました'); render(true); }); break; }
    case 'resetKid': await guard(async()=>{ await A.setMember(fid,uid,{settings:{}}); toast('標準にもどしました'); render(true); }); break;
    case 'addReward': { const n=$('#rName').value.trim(), c=Math.round(num($('#rCost').value,0)); if(!n||!c) return toast('名前とポイントを入れてください');
      await guard(async()=>{ await A.addReward(fid,{name:n,cost:c,perDay:int0($('#rDay').value),perWeek:int0($('#rWeek').value),expires:$('#rExp').value||''}); toast('追加しました'); }); break; }
    case 'delReward': if(confirm('このごほうびを削除しますか？')) guard(()=>A.delReward(fid,id)); break;
    case 'addMission': { const t=int0($('#mTarget').value,0), b=int0($('#mBonus').value,0); if(!t||!b) return toast('回数とボーナスを入れてください');
      await guard(async()=>{ await A.saveMissions(fid,[...missions(),{id:'m'+Date.now().toString(36),kind:$('#mKind').value,target:t,bonus:b}]); toast('追加しました'); }); break; }
    case 'delMission': if(confirm('このミッションを削除しますか？')) guard(()=>A.saveMissions(fid,missions().filter(x=>x.id!==id))); break;
    case 'approve': { const r=D().requests.find(x=>x.id===id); await guard(async()=>{ await A.setRequest(fid,id,{status:'approved',by:me().name,resolvedAt:Date.now()});
      await A.addLog(fid,{uid:r.uid,name:r.name,type:'approve',text:r.rewardName,at:Date.now()}); toast('承認しました'); }); break; }
    case 'reject': { const r=D().requests.find(x=>x.id===id); if(!confirm('見送りにして、ポイントを返しますか？')) return;
      await guard(async()=>{ await A.setRequest(fid,id,{status:'rejected',by:me().name,resolvedAt:Date.now()}); await A.addPoints(fid,r.uid,r.cost);
        await A.addLog(fid,{uid:r.uid,name:r.name,type:'reject',text:r.rewardName,pts:r.cost,at:Date.now()}); toast('ポイントを返しました'); }); break; }
    case 'adjust': { const m=D().members[uid]; const v=await ask({title:m.name+' さんのポイント調整',text:'ふやすなら 10、へらすなら -10 のように入力',type:'number',inputmode:'numeric',okText:'反映'});
      const n=Math.round(parseFloat(v)); if(!v||!isFinite(n)||n===0) return;
      await guard(async()=>{ await A.addPoints(fid,uid,n); await A.addLog(fid,{uid,name:m.name,type:'adjust',pts:n,text:'by '+me().name,at:Date.now()}); toast('調整しました'); }); break; }
    case 'copyCode': try{ await navigator.clipboard.writeText(D().family.code); toast('コピーしました'); }catch{ toast('コード: '+D().family.code); } break;
    case 'renameFam': { const n=$('#oName').value.trim(); if(n) await guard(async()=>{ await A.renameFamily(fid,n); toast('変更しました'); }); break; }
    case 'removeMember': if(confirm(D().members[uid].name+' さんを家族から外しますか？')) guard(()=>A.removeMember(fid,uid)); break;
    case 'setPin': { const a=$('#pin1')?.value??'', b=$('#pin2')?.value??'';
      if(!a) return toast('合言葉を入れてください');
      if(a!==b) return toast('2つが同じではありません');
      if(D().pinHash && !(await requirePin())) return;
      await guard(async()=>{ await A.setPin(fid,await hashPin(a)); App.pinUntil=Date.now()+5*60000; toast('合言葉を決めました'); if(App.screen==='setpin') App.screen='modes'; render(true); }); break; }
    case 'resetDemo': if(confirm('お試しデータを全部消します。よろしいですか？')){ A.reset(); localStorage.removeItem('yt_timer_demo'); location.reload(); } break;
  }
});
document.addEventListener('change',e=>{
  const sp=e.target.closest('[data-chg="showpw"]');
  if(sp){ ['pin1','pin2'].forEach(i=>{ const x=document.getElementById(i); if(x) x.type=sp.checked?'text':'password'; }); return; }
  const ks=e.target.closest('[data-chg="kidsel"]'); if(ks){ App.kidSel=ks.value; render(true); return; }
  const el=e.target.closest('[data-chg="role"]'); if(!el) return;
  guard(()=>App.adapter.setMember(App.fid,el.dataset.uid,{role:el.value}).then(()=>toast('役割を変えました')));
});

/* ---------------- Boot ---------------- */
(async function boot(){
  render(true);
  if(!NB.on && 'serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(()=>{});
  let cfg=FIREBASE_CONFIG; if(!cfg){ try{ cfg=JSON.parse(localStorage.getItem('yt_cfg')); }catch{} }
  try{
    if(localStorage.getItem('yt_demo')==='1') App.adapter=makeLocal();
    else if(cfg) App.adapter=await makeFirebase(cfg);
  }catch(e){ console.error(e); App.error='Firebaseの読みこみに失敗しました: '+(e.code||e.message); }
  if(App.adapter) App.adapter.onAuth(onUser); else { App.screen='login'; render(true); }
  NB.onToken(async t=>{ if(!t||!t.id||!App.adapter) return; try{ await App.adapter.signInWithToken(t); }catch(e){ App.error='ログインできませんでした: '+(e.code||e.message); render(true); } });
  setInterval(tick,500);
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden){ tick(); syncWake(); } });
})();
</script>
