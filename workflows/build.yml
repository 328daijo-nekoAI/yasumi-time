name: やすみタイム ビルド（ウェブ公開 + Windows/Mac/Android アプリ）

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: yasumi-build
  cancel-in-progress: true

jobs:
  pages-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/prepare-web.sh site site
      - uses: actions/configure-pages@v5
        continue-on-error: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  pages-deploy:
    needs: pages-build
    runs-on: ubuntu-latest
    continue-on-error: true   # Pages がまだ有効でなくても、アプリのビルドは続ける
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: ウェブ部分をアプリに同梱
        shell: bash
        run: |
          scripts/prepare-web.sh native/desktop/app
          mkdir -p native/desktop/build
          cp icon-512.png native/desktop/build/icon.png
      - name: Windows アプリをつくる
        shell: bash
        working-directory: native/desktop
        run: |
          npm install --no-audit --no-fund
          npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: native/desktop/dist/yasumi-windows.exe
          if-no-files-found: error

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: ウェブ部分をアプリに同梱
        run: |
          scripts/prepare-web.sh native/desktop/app
          mkdir -p native/desktop/build
          cp icon-512.png native/desktop/build/icon.png
      - name: Mac アプリをつくる
        working-directory: native/desktop
        run: |
          npm install --no-audit --no-fund
          npm run dist:mac
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: native/desktop/dist/yasumi-mac.dmg
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: ウェブ部分をアプリに同梱
        run: scripts/prepare-web.sh native/android/www
      - name: Android プロジェクトをつくる
        working-directory: native/android
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          node setup.mjs
          npx cap sync android
      - name: APK をつくる
        working-directory: native/android/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../../yasumi-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: yasumi-android.apk
          if-no-files-found: error

  release:
    needs: [windows, mac, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - run: ls -la release
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: やすみタイム 第${{ github.run_number }}版
          files: release/*
          make_latest: true
