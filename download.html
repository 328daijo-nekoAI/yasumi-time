<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>やすみタイム ダウンロード</title>
<meta name="theme-color" content="#4f7cff">
<link rel="icon" href="icon-192.png">
<style>
:root{--p:#4f7cff;--pd:#3a63d8;--bg:#f2f6fd;--card:#fff;--tx:#22304a;--mut:#6b7a96;--line:#e3e9f4;--soft:#eaf0ff;--ok:#2fb36b;--warn:#a0620a;--warnbg:#fff1d6}
@media (prefers-color-scheme:dark){:root{--bg:#12182b;--card:#1b2340;--tx:#e9ecf6;--mut:#9aa6c4;--line:#2b3562;--soft:#25305a;--pd:#9db7ff;--warn:#ffcf7a;--warnbg:#3a2e12}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI","Noto Sans JP",sans-serif}
main{max-width:720px;margin:0 auto;padding:28px 16px 60px}
.hero{text-align:center;padding:10px 0 22px}
.hero img{width:72px;height:72px;border-radius:18px}
h1{font-size:28px;margin:10px 0 6px}
.muted{color:var(--mut);font-size:14px;line-height:1.7}
.card{background:var(--card);border-radius:22px;padding:20px;margin:0 0 16px;box-shadow:0 2px 12px rgba(40,60,110,.08)}
h2{font-size:17px;margin:0 0 4px}
.steps{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.n{width:28px;height:28px;border-radius:50%;background:var(--p);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
.opts{display:grid;gap:10px;margin-top:12px}
.opt{display:flex;align-items:center;gap:14px;border:2px solid var(--line);border-radius:18px;padding:14px 16px;cursor:pointer;background:var(--card);transition:border-color .15s,background .15s}
.opt:has(input:checked){border-color:var(--p);background:var(--soft)}
.opt input{width:22px;height:22px;accent-color:var(--p);flex:none}
.opt .ic{font-size:30px;flex:none}
.opt b{display:block;font-size:16px}
.opt span{font-size:12.5px;color:var(--mut)}
.opt .tag{margin-left:auto;font-size:11px;font-weight:800;background:var(--p);color:#fff;border-radius:99px;padding:3px 9px;flex:none}
.dl{display:block;width:100%;border:0;border-radius:18px;background:var(--p);color:#fff;font:inherit;font-weight:800;font-size:19px;padding:17px;cursor:pointer;margin-top:16px}
.dl:disabled{opacity:.45;cursor:not-allowed}
.dl:active{transform:scale(.99)}
.status{margin-top:12px;font-size:14px;line-height:1.7;min-height:22px}
.status.ok{color:var(--ok);font-weight:700}
.alt{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.alt a{flex:1;min-width:200px;text-align:center;text-decoration:none;background:var(--soft);color:var(--pd);font-weight:800;border-radius:14px;padding:13px}
details{border-top:1px solid var(--line);padding:12px 0}
details:first-of-type{border-top:0}
summary{cursor:pointer;font-weight:800;font-size:15px}
ol{margin:10px 0 0;padding-left:22px;line-height:1.9;font-size:14px}
.note{background:var(--warnbg);color:var(--warn);border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.7;margin-top:10px}
input[type=text]{font:inherit;width:100%;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--card);color:var(--tx)}
code{background:var(--soft);padding:1px 6px;border-radius:6px;font-size:12px}
.hidden{display:none}
</style>
</head>
<body>
<main>
  <div class="hero">
    <img src="icon-192.png" alt="">
    <h1>やすみタイム をダウンロード</h1>
    <div class="muted">使う機械を選んで、ボタンを押すだけ。<br>アプリを入れたあとは、ブラウザを開かずに使えます。</div>
  </div>

  <div class="card">
    <div class="steps"><div class="n">1</div><h2>どの機械に入れる？（いくつでも選べます）</h2></div>
    <div class="opts" id="opts">
      <label class="opt"><input type="checkbox" value="windows"><span class="ic">🪟</span><div><b>Windows パソコン</b><span>exe（インストーラー）</span></div></label>
      <label class="opt"><input type="checkbox" value="android"><span class="ic">🤖</span><div><b>Android スマホ・タブレット</b><span>APK</span></div></label>
      <label class="opt"><input type="checkbox" value="mac"><span class="ic">🍎</span><div><b>Mac パソコン</b><span>dmg（Apple シリコン・Intel どちらも）</span></div></label>
    </div>

    <div class="steps" style="margin-top:20px"><div class="n">2</div><h2>ボタンを押す</h2></div>
    <button class="dl" id="dl" disabled>⬇ ダウンロード</button>
    <div class="status" id="st"></div>

    <div id="repoBox" class="hidden" style="margin-top:12px">
      <div class="muted">ダウンロード元のGitHubリポジトリが分かりません。<code>ユーザー名/リポジトリ名</code> の形で入れてください。</div>
      <input type="text" id="repo" placeholder="例: yamada/yasumi-time" style="margin-top:8px">
    </div>
  </div>

  <div class="card">
    <div class="steps"><div class="n">3</div><h2>入れたら、アプリを開く</h2></div>
    <div id="howto"></div>
    <div class="alt">
      <a href="index.html" id="web">🌐 ブラウザ版をひらく（お気に入り登録・ホーム画面に追加もできます）</a>
    </div>
  </div>

  <div class="muted" style="text-align:center">
    最新版の一覧：<a id="rel" href="#" target="_blank" rel="noopener" style="color:var(--pd)">GitHub のリリースページ</a>
  </div>
</main>

<script src="native-config.js"></script>
<script>
const $ = s => document.querySelector(s);
const FILES = { windows:'yasumi-windows.exe', android:'yasumi-android.apk', mac:'yasumi-mac.dmg' };
const NAMES = { windows:'Windows', android:'Android', mac:'Mac' };

/* リポジトリ（ユーザー名/リポジトリ名）を決める */
function guessRepo(){
  let r = String(window.YASUMI_REPO||'').trim();
  if(!r){ try{ r = localStorage.getItem('yt_repo')||''; }catch{} }
  if(!r && /\.github\.io$/.test(location.hostname)){
    const owner = location.hostname.split('.')[0], repo = location.pathname.split('/').filter(Boolean)[0];
    if(owner && repo && !/\.html$/.test(repo)) r = owner+'/'+repo;
  }
  return r;
}
let repo = guessRepo();
const baseUrl = () => `https://github.com/${repo}/releases/latest/download/`;
function refreshRepo(){
  $('#repoBox').classList.toggle('hidden', !!repo);
  $('#rel').href = repo ? `https://github.com/${repo}/releases/latest` : '#';
  update();
}
$('#repo').addEventListener('input', e=>{
  const v = e.target.value.trim().replace(/^https?:\/\/github\.com\//,'').replace(/\/+$/,'');
  repo = /^[\w.-]+\/[\w.-]+$/.test(v) ? v : '';
  try{ if(repo) localStorage.setItem('yt_repo',repo); }catch{}
  $('#rel').href = repo ? `https://github.com/${repo}/releases/latest` : '#';
  update();
});

/* いま使っている機械をあらかじめ選ぶ */
function detect(){
  const ua = navigator.userAgent;
  if(/Android/i.test(ua)) return 'android';
  if(/Windows/i.test(ua)) return 'windows';
  if(/Mac/i.test(ua) && !/iPhone|iPad/i.test(ua)) return 'mac';
  return '';
}
const boxes = [...document.querySelectorAll('#opts input')];
const pre = detect();
boxes.forEach(b=>{
  if(b.value===pre){ b.checked = true; const t=document.createElement('span'); t.className='tag'; t.textContent='この機械'; b.closest('.opt').appendChild(t); }
  b.addEventListener('change', update);
});

const HOWTO = {
  windows:`<ol><li>ダウンロードした <code>yasumi-windows.exe</code> をダブルクリックします。</li><li>「WindowsによってPCが保護されました」と出たら、<b>「詳細情報」→「実行」</b>を押します（個人で作ったアプリのため、最初だけ出ます）。</li><li>自動でインストールされ、「やすみタイム」が開きます。次からはスタートメニューから開けます。</li></ol>`,
  android:`<ol><li>ダウンロードした <code>yasumi-android.apk</code> をタップして開きます。</li><li>「提供元不明のアプリ」の許可を求められたら、<b>今使っているブラウザ（またはファイル管理アプリ）に許可</b>を出して、もう一度開きます。</li><li>「インストール」を押すと入ります。Google Play プロテクトの確認が出たら「このまま インストール」を選びます。</li><li>開いたら、保護者パネル → 設定 →「この端末で画面ロックを使えるようにする」を押すと、休憩中に端末ロックまでできます。</li></ol>`,
  mac:`<ol><li>ダウンロードした <code>yasumi-mac.dmg</code> を開き、アプリを「アプリケーション」へドラッグします。</li><li>はじめて開くときは、<b>アプリを右クリック（control＋クリック）→「開く」</b>を選び、出てきた画面でもう一度「開く」を押します。</li><li>「壊れているため開けません」と出たら、ターミナルで <code>xattr -cr /Applications/YasumiTime.app</code> を実行してから開き直します。</li></ol>`
};
function selected(){ return boxes.filter(b=>b.checked).map(b=>b.value); }
function update(){
  const sel = selected();
  $('#dl').disabled = !sel.length || !repo;
  $('#dl').textContent = sel.length ? `⬇ ダウンロード（${sel.map(k=>NAMES[k]).join('・')}）` : '⬇ ダウンロード';
  $('#howto').innerHTML = sel.length
    ? sel.map(k=>`<details open><summary>${{windows:'🪟 Windows',android:'🤖 Android',mac:'🍎 Mac'}[k]} のとき</summary>${HOWTO[k]}</details>`).join('')
    : '<div class="muted">上で機械を選ぶと、入れかたがここに出ます。</div>';
}
$('#dl').addEventListener('click', ()=>{
  const sel = selected(); if(!sel.length||!repo) return;
  $('#st').className='status ok'; $('#st').textContent='ダウンロードをはじめます…（ブラウザの確認が出たら「許可」を押してください）';
  sel.forEach((k,i)=>setTimeout(()=>{
    const a=document.createElement('a'); a.href=baseUrl()+FILES[k]; a.rel='noopener'; document.body.appendChild(a); a.click(); a.remove();
  }, i*1200));
  setTimeout(()=>{ $('#st').innerHTML='ダウンロードが始まらないときは、<a href="'+baseUrl().replace('/download/','')+'" target="_blank" rel="noopener" style="color:var(--pd)">リリースページ</a>から直接えらべます。まだ最初のビルドが終わっていない場合は、数分待ってからもう一度押してください。'; $('#st').className='status'; }, sel.length*1200+1800);
});
refreshRepo();
</script>
</body>
</html>
